name: Deploy Frontend to GitHub Pages

# 1. GATILHOS OTIMIZADOS
on:
  # Dispara apenas em pushes na branch onde o projeto está
  push:
    branches:
      - 'gitpages' 

  # Dispara em PRs direcionados à branch principal do projeto
  pull_request:
    branches:
      - 'gitpages'
    types: [opened, synchronize, reopened, closed]

  # Mantém a atualização do painel em tempo real quando as issues mudam
  issues:
    types: [opened, edited, closed, reopened]

  # Permite o disparo manual pela interface do GitHub
  workflow_dispatch:

# 2. PERMISSÕES NECESSÁRIAS
permissions:
  contents: read
  pages: write
  id-token: write

# 3. CONTROLE DE CONCORRÊNCIA
concurrency:
  group: "pages"
  cancel-in-progress: false

# 4. TRABALHO A SER EXECUTADO
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      # ========================================================
      # INÍCIO DA ESTEIRA DE DADOS (ETL EM PYTHON)
      # ========================================================
      - name: Configurar o Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Instalar Dependências (Requests)
        run: pip install requests

      - name: Executar ETL (Extrair, Tratar e Carregar Dados JSON)
        env:
          IHC_GITHUB_TOKEN: ${{ secrets.IHC_GITHUB_TOKEN }}
        run: python backend/export_data.py
      # ========================================================

      - name: Configurar o Pages
        uses: actions/configure-pages@v4

      - name: Fazer o Upload dos Artefatos (Pasta frontend)
        uses: actions/upload-pages-artifact@v3
        with:
          path: './frontend'

      - name: Fazer o Deploy para o GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4